<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crawlポイ活</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --primary: #0284c7;
      --accent: #d97706;
      --text: #1e293b;
      --text-sub: #64748b;
      --danger: #ef4444;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: #ffffff; border-bottom: 1px solid var(--card-border); padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
    }
    .logo-title { font-size: 1.3rem; font-weight: 800; color: var(--primary); }
    .menu-btn { background: #f1f5f9; border: 1px solid var(--card-border); color: var(--text); font-size: 1.2rem; cursor: pointer; padding: 6px 12px; border-radius: 8px; }

    main { flex: 1; padding: 20px 16px; max-width: 640px; margin: 0 auto; width: 100%; }

    .point-board {
      background: var(--card-bg); border: 1px solid var(--card-border); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 24px;
    }
    .point-values { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .point-box { background: #f8fafc; border: 1px solid var(--card-border); padding: 14px; border-radius: 12px; text-align: center; }
    .point-box .label { font-size: 0.75rem; color: var(--text-sub); font-weight: 700; margin-bottom: 6px; }
    .point-box .value { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .point-box .value.pending { color: var(--accent); }

    .exchange-trigger-btn {
      width: 100%; padding: 12px; background: #10b981; color: #fff; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 0.95rem;
    }

    .drawer-overlay { position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); display: none; z-index: 200; }
    .drawer { position: fixed; top:0; right:-300px; width:300px; height:100vh; background: #ffffff; border-left: 1px solid var(--card-border); z-index: 201; transition: right 0.3s ease; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }
    .drawer.open { right: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 14px; }
    .close-btn { background: none; border: none; font-size: 1.4rem; color: var(--text-sub); cursor: pointer; }
    .user-info-card { background: #f8fafc; border: 1px solid var(--card-border); padding: 16px; border-radius: 12px; font-size: 0.85rem; line-height: 1.8; }
    .drawer-btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; }
    .drawer-btn.delete-btn { background: var(--danger); margin-top: auto; }

    .init-survey-card { background: var(--card-bg); border: 2px solid var(--primary); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow-lg); }
    .init-survey-card h2 { font-size: 1.2rem; color: var(--primary); margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--card-border); border-radius: 8px; }

    .submit-btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; }

    .section-title { font-size: 1rem; font-weight: 800; color: var(--text); margin: 24px 0 12px; padding-left: 10px; border-left: 4px solid var(--primary); }
    .survey-list { display: flex; flex-direction: column; gap: 12px; }
    .survey-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .survey-info { flex: 1; padding-right: 12px; }
    .survey-name { font-size: 0.95rem; font-weight: 700; margin-bottom: 6px; }
    .survey-point { font-size: 0.9rem; color: var(--primary); font-weight: 800; }
    .survey-action .btn { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .survey-action .btn.done { background: #94a3b8; cursor: not-allowed; }
    .survey-action .btn.pending-btn { background: var(--accent); cursor: not-allowed; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); display: none; justify-content: center; align-items: center; z-index: 300; padding: 16px; }
    .modal { background: #ffffff; border-radius: 16px; padding: 20px; max-width: 500px; width: 100%; text-align: center; box-shadow: var(--shadow-lg); border: 1px solid var(--card-border); }
    .survey-iframe-container { width: 100%; height: 55vh; border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
    .survey-iframe-container iframe { width: 100%; height: 100%; border: none; }

    .modal-btn-group { display: flex; gap: 10px; }
    .modal-btn-group button { flex: 1; padding: 12px; border-radius: 8px; font-weight: 800; border: none; cursor: pointer; }
    .btn-submit-done { background: var(--primary); color: #fff; }
    .btn-cancel { background: #e2e8f0; color: var(--text-sub); }

    .spinner { width: 40px; height: 40px; border: 4px solid #e0f2fe; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <span class="logo-title">Crawlポイ活</span>
    <button class="menu-btn" onclick="toggleDrawer(true)">☰</button>
  </header>

  <main>
    <div class="point-board">
      <div class="point-values">
        <div class="point-box">
          <div class="label">獲得Point</div>
          <div class="value" id="earnedPoint">0 pt</div>
        </div>
        <div class="point-box">
          <div class="label">判定中Point</div>
          <div class="value pending" id="pendingPoint">0 pt</div>
        </div>
      </div>
      <button class="exchange-trigger-btn" onclick="openExchangeModal()">ポイントを交換する</button>
    </div>

    <div class="init-survey-card" id="initSurveyCard" style="display: none;">
      <h2>初回登録</h2>
      <div class="form-group">
        <label>モニターID</label>
        <input type="text" id="regId" readonly>
      </div>
      <div class="form-group">
        <label>お名前</label>
        <input type="text" id="regName" placeholder="例: 山田 太郎">
      </div>
      <div class="form-group">
        <label>年齢</label>
        <input type="number" id="regAge" placeholder="例: 25">
      </div>
      <div class="form-group">
        <label>都道府県</label>
        <input type="text" id="regPref" placeholder="例: 東京都">
      </div>
      <button class="submit-btn" onclick="submitInitSurvey()">登録してはじめる</button>
    </div>

    <div class="section-title">事前アンケート</div>
    <div class="survey-list" id="preliminaryList">
      <div style="text-align:center; padding:12px; color:var(--text-sub);">読み込み中...</div>
    </div>

    <div class="section-title">本アンケート</div>
    <div class="survey-list" id="mainList">
      <div style="text-align:center; padding:12px; color:var(--text-sub);">読み込み中...</div>
    </div>
  </main>

  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <strong>メニュー</strong>
      <button class="close-btn" onclick="toggleDrawer(false)">✕</button>
    </div>
    <div class="user-info-card" id="userInfoDisplay">未登録です</div>
    <button class="drawer-btn" onclick="toggleDrawer(false); openExchangeModal();">ポイント交換申請</button>
    <button class="drawer-btn delete-btn" onclick="clearUserData()">モニター情報初期化</button>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h3 id="modalTitle">アンケート回答</h3>
      <div id="modalBody"></div>
    </div>
  </div>

<script>
  // 最新のGAS Web App URLを組み込み済み
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyTAYsfiGOhOmz1S_9QZVFldbL0DghQ4CTsl0Gygv_E27PALgdioVXU0QbR1GbmH3QG/exec';

  let userData = JSON.parse(localStorage.getItem('crawl_user_data')) || null;
  let answeredState = JSON.parse(localStorage.getItem('crawl_answered_state')) || {}; 
  let currentEarnedPoints = 0;

  function getOrGenerateID() {
    if (userData && userData.id) return String(userData.id).padStart(3, '0');
    let savedId = localStorage.getItem('crawl_user_id');
    if (!savedId) {
      savedId = String(Math.floor(100 + Math.random() * 900));
      localStorage.setItem('crawl_user_id', savedId);
    }
    return savedId;
  }

  const userId = getOrGenerateID();

  window.addEventListener('DOMContentLoaded', () => {
    checkRegistration();
    fetchSurveys();
    setInterval(fetchSurveys, 8000);
  });

  function checkRegistration() {
    if (!userData) {
      document.getElementById('initSurveyCard').style.display = 'block';
      document.getElementById('regId').value = userId;
    } else {
      document.getElementById('initSurveyCard').style.display = 'none';
    }
    updateDrawerInfo();
  }

  function submitInitSurvey() {
    const name = document.getElementById('regName').value.trim();
    const age = document.getElementById('regAge').value.trim();
    const pref = document.getElementById('regPref').value.trim();

    if (!name || !age || !pref) {
      alert('すべての項目を入力してください。');
      return;
    }

    userData = { id: userId, name, age, pref };
    localStorage.setItem('crawl_user_data', JSON.stringify(userData));
    checkRegistration();
  }

  function updateDrawerInfo() {
    const display = document.getElementById('userInfoDisplay');
    if (userData) {
      display.innerHTML = `
        <div><strong>ID:</strong> ${userData.id}</div>
        <div><strong>名前:</strong> ${userData.name}</div>
        <div><strong>年齢:</strong> ${userData.age} 歳</div>
        <div><strong>地域:</strong> ${userData.pref}</div>
      `;
    }
  }

  function clearUserData() {
    if (confirm('初期化しますか？')) {
      localStorage.clear();
      location.reload();
    }
  }

  function toggleDrawer(open) {
    document.getElementById('drawer').classList.toggle('open', open);
    document.getElementById('drawerOverlay').style.display = open ? 'block' : 'none';
  }

  async function fetchSurveys() {
    try {
      const response = await fetch(GAS_WEB_APP_URL, { method: 'GET' });
      const data = await response.json();

      if (Array.isArray(data)) {
        renderSurveys(data);
      }
    } catch (e) {
      console.error("Fetch Failure:", e);
    }
  }

  function renderSurveys(rows) {
    const preContainer = document.getElementById('preliminaryList');
    const mainContainer = document.getElementById('mainList');

    preContainer.innerHTML = '';
    mainContainer.innerHTML = '';

    let totalEarned = 0;
    let totalPending = 0;
    let preCount = 0;
    let mainCount = 0;

    rows.forEach(row => {
      const name = row.name;
      const point = Number(row.point || 0);
      const type = row.type;
      const link = row.link;
      const earnedUsers = row.earnedUsers || '';
      const targetUsers = row.targetUsers || '';

      const isEarned = earnedUsers.split(/[、,]/).map(s => s.trim()).includes(userId);
      if (isEarned) answeredState[name] = 'earned';

      const currentState = answeredState[name];

      if (currentState === 'earned') totalEarned += point;
      else if (currentState === 'pending') totalPending += point;

      if (type === '本') {
        const isTarget = targetUsers.split(/[、,]/).map(s => s.trim()).includes(userId);
        if (!isTarget) return;
      }

      const card = document.createElement('div');
      card.className = 'survey-card';

      let btnHTML = '';
      if (currentState === 'earned') {
        btnHTML = `<button class="btn done" disabled>獲得済み</button>`;
      } else if (currentState === 'pending') {
        btnHTML = `<button class="btn pending-btn" disabled>判定中</button>`;
      } else {
        btnHTML = `<button class="btn" onclick="openSurveyModal('${encodeURIComponent(name)}', '${encodeURIComponent(link)}')">回答する</button>`;
      }

      card.innerHTML = `
        <div class="survey-info">
          <div class="survey-name">${name}</div>
          <div class="survey-point">+${point} pt</div>
        </div>
        <div class="survey-action">${btnHTML}</div>
      `;

      if (type === '事前') {
        preContainer.appendChild(card);
        preCount++;
      } else if (type === '本') {
        mainContainer.appendChild(card);
        mainCount++;
      }
    });

    if (preCount === 0) preContainer.innerHTML = '<div style="text-align:center; padding:12px; color:var(--text-sub);">対象の事前アンケートはありません</div>';
    if (mainCount === 0) mainContainer.innerHTML = '<div style="text-align:center; padding:12px; color:var(--text-sub);">対象の本アンケートはありません</div>';

    currentEarnedPoints = totalEarned;
    document.getElementById('earnedPoint').textContent = `${totalEarned} pt`;
    document.getElementById('pendingPoint').textContent = `${totalPending} pt`;
  }

  function openSurveyModal(encName, encLink) {
    if (!userData) {
      alert('先に初回登録を完了してください。');
      return;
    }
    const name = decodeURIComponent(encName);
    const link = decodeURIComponent(encLink);

    document.getElementById('modalTitle').textContent = name;
    document.getElementById('modalBody').innerHTML = `
      <div class="survey-iframe-container">
        <iframe src="${link}"></iframe>
      </div>
      <div class="modal-btn-group">
        <button class="btn-cancel" onclick="closeModal()">回答をやめる</button>
        <button class="btn-submit-done" onclick="finishSurvey('${encodeURIComponent(name)}')">回答完了（Submit後に押す）</button>
      </div>
    `;
    document.getElementById('confirmModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('confirmModal').style.display = 'none';
  }

  function finishSurvey(encName) {
    const name = decodeURIComponent(encName);
    answeredState[name] = 'pending';
    localStorage.setItem('crawl_answered_state', JSON.stringify(answeredState));

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({ userId: userId, surveyName: name })
    });

    document.getElementById('modalTitle').textContent = "判定処理中";
    document.getElementById('modalBody').innerHTML = `
      <div class="spinner"></div>
      <p style="color: var(--primary); font-weight: bold;">自動判定を行なっています...</p>
    `;

    setTimeout(() => {
      closeModal();
      fetchSurveys();
    }, 1500);
  }

  function openExchangeModal() {
    if (!userData) {
      alert('先に初回登録を完了してください。');
      return;
    }

    document.getElementById('modalTitle').textContent = "ポイント交換申請";
    document.getElementById('modalBody').innerHTML = `
      <div style="padding: 10px 0;">
        <p style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 12px;">現在の獲得ポイント: <strong>${currentEarnedPoints} pt</strong></p>
        <div class="form-group" style="text-align: left;">
          <label>交換したいポイント数</label>
          <input type="number" id="exchangeAmount" min="100" placeholder="例: 500">
        </div>
      </div>
      <div class="modal-btn-group">
        <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
        <button class="btn-submit-done" onclick="submitExchange()">交換を申請する</button>
      </div>
    `;
    document.getElementById('confirmModal').style.display = 'flex';
  }

  function submitExchange() {
    const amount = Number(document.getElementById('exchangeAmount').value);
    if (!amount || amount <= 0) {
      alert('正しいポイント数を入力してください。');
      return;
    }
    if (amount > currentEarnedPoints) {
      alert('保有ポイント以上の金額は指定できません。');
      return;
    }

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({ action: 'exchange', userId: userId, points: amount })
    });

    alert('交換申請を受け付けました！確認後、反映処理が行われます。');
    closeModal();
  }
</script>
</body>
</html>
