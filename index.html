<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Local Web</title>
  <style>
    :root {
      --bg-color: #131314;
      --card-bg: #1e1f20;
      --user-msg: #2b2c2e;
      --accent: #a8c7fa;
      --text: #e3e2e6;
      --muted: #8e918f;
      --border: #444746;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', sans-serif, system-ui; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      height: 100vh;
      padding: 0;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #1e1f20;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: bold;
      background: linear-gradient(135deg, #7cacf8, #f87171, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .mode-tabs {
      display: flex;
      gap: 6px;
      background: #131314;
      padding: 4px;
      border-radius: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 0;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #282a2c;
      color: var(--accent);
    }

    .status-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 0 4px;
    }

    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-msg);
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      align-self: flex-start;
      background: transparent;
      padding-left: 0;
    }

    .msg.system {
      align-self: center;
      background: #3c1e1e;
      color: #f87171;
      font-size: 0.8rem;
    }

    pre {
      background: #000;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      font-family: monospace;
      color: #38bdf8;
    }

    .generated-img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 8px;
      border: 1px solid var(--border);
    }

    .input-box {
      padding: 12px;
      background: var(--bg-color);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      background: #1e1f20;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 14px 20px;
      color: var(--text);
      outline: none;
      font-size: 0.95rem;
    }

    .send-btn {
      background: var(--accent);
      color: #040e15;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .code-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.75rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="header-top">
      <div class="logo">✨ Gemini Local</div>
      <button class="code-btn" onclick="enterCode()">コード入力</button>
    </div>

    <div class="mode-tabs">
      <button class="tab-btn active" id="btn-FLASH" onclick="setMode('FLASH')">FLASH</button>
      <button class="tab-btn" id="btn-FLASH_PLUS" onclick="setMode('FLASH_PLUS')">FLASH+</button>
      <button class="tab-btn" id="btn-PRO_AI" onclick="setMode('PRO_AI')">PRO AI</button>
      <button class="tab-btn" id="btn-PRO_PLUS" onclick="setMode('PRO_PLUS')">PRO+</button>
    </div>

    <div class="status-info">
      <span id="planStatus">無料モード</span>
      <span id="usageStatus">残通数: 100通 / 2時間</span>
    </div>
  </header>

  <div class="chat-box" id="chatBox">
    <div class="msg ai">
      こんにちは！何でも質問してください。コード作成や「〜の画像を描いて」でイラスト生成もできます！✨
    </div>
  </div>

  <div class="input-box">
    <input type="text" id="userInput" placeholder="メッセージまたは「○○の画像を描いて」..." onkeypress="onKey(event)">
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
  let mode = "FLASH";
  let isPremium = false;

  function init() {
    const now = Date.now();
    let reset = localStorage.getItem("resetTime");
    if (!reset || now > parseInt(reset)) {
      localStorage.setItem("resetTime", now + 2 * 60 * 60 * 1000);
      localStorage.setItem("used", "0");
      localStorage.setItem("proAi", "0");
      localStorage.setItem("proPlus", "0");
    }
    isPremium = localStorage.getItem("isPremium") === "true";
    updateUI();
  }

  function updateUI() {
    const used = parseInt(localStorage.getItem("used") || "0");
    const max = isPremium ? 150 : 100;
    document.getElementById("planStatus").textContent = isPremium ? "🌟 プレミアム" : "無料モード";
    document.getElementById("usageStatus").textContent = `使用可能: ${max - used}/${max}通`;
  }

  function setMode(m) {
    mode = m;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.getElementById(`btn-${m.replace('+', '_PLUS')}`).classList.add("active");
  }

  function enterCode() {
    const c = prompt("プレミアムコードを入力:");
    if (c === "5533") {
      isPremium = true;
      localStorage.setItem("isPremium", "true");
      alert("プレミアムモード解放！(150通/2時間・PRO+制限解除)");
      updateUI();
    }
  }

  async function sendMsg() {
    const input = document.getElementById("userInput");
    const txt = input.value.trim();
    if (!txt) return;

    let used = parseInt(localStorage.getItem("used") || "0");
    const max = isPremium ? 150 : 100;
    let cost = (mode === "PRO_AI") ? 3 : 1;

    if (mode === "PRO_AI" && !isPremium && parseInt(localStorage.getItem("proAi")||"0") >= 10) {
      addMsg("system", "PRO AI の無料回数上限（10回）に達しました。");
      return;
    }
    if (mode === "PRO_PLUS" && !isPremium) {
      addMsg("system", "PRO+ はプレミアム限定機能です。");
      return;
    }

    if (used + cost > max) {
      addMsg("system", "2時間の制限に達しました。しばらくお待ちください。");
      return;
    }

    localStorage.setItem("used", (used + cost).toString());
    if (mode === "PRO_AI") localStorage.setItem("proAi", (parseInt(localStorage.getItem("proAi")||"0")+1).toString());
    updateUI();

    addMsg("user", txt);
    input.value = "";

    const aiDiv = addMsg("ai", "思考中...");

    let delay = 800;
    if (mode === "PRO_AI") delay = 17000;
    if (mode === "PRO_PLUS") delay = 15000;

    let start = Date.now();
    let timer = setInterval(() => {
      if (mode === "PRO_AI" || mode === "PRO_PLUS") {
        let p = Math.min(100, Math.floor(((Date.now() - start) / delay) * 100));
        aiDiv.textContent = `思考中... 回答文生成 ${p}%`;
      }
    }, 200);

    setTimeout(async () => {
      clearInterval(timer);
      
      // 画像生成判定
      if (txt.includes("画像") || txt.includes("描いて") || txt.includes("イラスト")) {
        aiDiv.textContent = "画像を生成しました！";
        const img = document.createElement("img");
        const promptText = encodeURIComponent(txt.replace(/(画像|描いて|イラスト|の)/g, ""));
        img.src = `https://image.pollinations.ai/prompt/${promptText}?width=512&height=512&nologo=true`;
        img.className = "generated-img";
        aiDiv.appendChild(img);
        return;
      }

      // コード要求判定
      if (txt.includes("コード") || txt.includes("HTML") || txt.includes("プログラム")) {
        aiDiv.innerHTML = `ご提示のコード例です：<pre><code>// ${txt} のサンプルプログラム\nfunction example() {\n  console.log("Hello Local AI!");\n}</code></pre>`;
        return;
      }

      // 通常会話応答
      aiDiv.textContent = `【${mode} モード応答】\n「${txt}」についてご案内します。現在の設定でスムーズに処理されました！`;
    }, delay);
  }

  function onKey(e) { if (e.key === "Enter") sendMsg(); }

  function addMsg(type, content) {
    const box = document.getElementById("chatBox");
    const d = document.createElement("div");
    d.className = `msg ${type}`;
    d.textContent = content;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    return d;
  }

  init();
</script>
</body>
</html>
