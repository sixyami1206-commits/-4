<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>crawlWeb</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .logo-container { text-align: center; }
    .logo-main {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo-sub { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; }

    .search-box {
      width: 100%;
      max-width: 680px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box:focus-within { border-color: var(--accent); }

    input.search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
      padding: 6px 8px;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn:hover { border-color: var(--accent); }
    .btn-ai { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0f172a; border: none; }
    .game-mode-btn { background: rgba(56, 189, 248, 0.2); border-color: var(--accent); color: var(--accent); display: none; }

    .content-viewport {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .results-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .result-card h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .result-card h3 a { color: var(--accent); text-decoration: none; }
    .result-card h3 a:hover { text-decoration: underline; }
    .result-card p { color: #cbd5e1; font-size: 0.9rem; line-height: 1.6; }
    .result-url { font-size: 0.75rem; color: #64748b; margin-bottom: 4px; display: block; word-break: break-all; }

    .error-msg { color: #f87171; font-weight: bold; text-align: center; padding: 40px 0; }

    .game-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000;
      display: none;
      z-index: 9999;
    }

    .game-controls {
      position: absolute;
      top: 16px; right: 16px;
      display: flex; gap: 12px; align-items: center;
      background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; border: 1px solid #333;
    }

    .fps-badge { color: #22c55e; font-size: 0.85rem; font-family: monospace; font-weight: bold; }
    .off-btn { background: #ef4444; color: #fff; border: none; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    canvas#gpuCanvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-main">crawlWeb</div>
      <div class="logo-sub">クロワルウェィブ</div>
    </div>

    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="検索キーワードを入力..." onkeydown="if(event.key==='Enter') execSearch('google')">
      <button class="btn" onclick="execSearch('google')">Google検索</button>
      <button class="btn btn-ai" onclick="execSearch('ai')">CrawlAI検索</button>
      <button class="btn game-mode-btn" id="gameBtn" onclick="enableGameMode()">🎮 ゲームモード</button>
    </div>
  </header>

  <div class="content-viewport">
    <div class="results-container" id="resultsArea">
      <div class="result-card">
        <h3>🚀 crawlWeb 準備完了</h3>
        <p>キーワードを入力して検索を実行してください。</p>
      </div>
    </div>
  </div>

  <div class="game-overlay" id="gameOverlay">
    <canvas id="gpuCanvas"></canvas>
    <div class="game-controls">
      <span class="fps-badge" id="fpsDisplay">FPS: -- (GPU Max)</span>
      <button class="off-btn" onclick="disableGameMode()">OFF</button>
    </div>
  </div>

<script>
  const CX_KEY = "0220ba049f4274edf";

  function showGameBtn() {
    document.getElementById("gameBtn").style.display = "inline-block";
  }

  // Google CSE JSONP Callback
  window.handleGoogleResults = function(data) {
    const resultsArea = document.getElementById("resultsArea");
    if (data && data.items && data.items.length > 0) {
      let html = '';
      data.items.forEach(item => {
        html += `
          <div class="result-card">
            <span class="result-url">${item.link}</span>
            <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
            <p>${item.snippet || ''}</p>
          </div>
        `;
      });
      resultsArea.innerHTML = html;
    } else {
      resultsArea.innerHTML = `<div class="result-card"><p>検索結果が見つかりませんでした。</p></div>`;
    }
  };

  function execSearch(type) {
    const rawVal = document.getElementById("searchInput").value.trim();
    const resultsArea = document.getElementById("resultsArea");

    if (!rawVal) return;

    showGameBtn();

    if (type === 'google') {
      resultsArea.innerHTML = `<div class="result-card"><p>🔍 「${rawVal}」を検索中...</p></div>`;

      // スクリプトタグを動的生成してJSONP検索（CORS回避）
      const oldScript = document.getElementById('googleSearchScript');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'googleSearchScript';
      script.src = `https://www.googleapis.com/customsearch/v1?key=&cx=${CX_KEY}&q=${encodeURIComponent(rawVal)}&callback=handleGoogleResults`;
      
      // CSEエレメントのJSONPエンドポイント
      const cseScript = document.createElement('script');
      cseScript.src = `https://cse.google.com/api/0220ba049f4274edf/desc/v1?q=${encodeURIComponent(rawVal)}&callback=handleGoogleResults`;
      
      document.body.appendChild(cseScript);

    } else if (type === 'ai') {
      const aiQuery = `${rawVal}について`;
      resultsArea.innerHTML = `<div class="result-card"><h3>🤖 CrawlAI: 「${aiQuery}」</h3><p>🔍 情報を解析・収集しています...</p></div>`;

      fetchCrawlAI(rawVal, aiQuery);
    }
  }

  async function fetchCrawlAI(rawVal, aiQuery) {
    const resultsArea = document.getElementById("resultsArea");
    try {
      const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(rawVal)}`);
      if (res.ok) {
        const data = await res.json();
        if (data.extract) {
          resultsArea.innerHTML = `
            <div class="result-card">
              <h3>🤖 CrawlAI: 「${aiQuery}」</h3>
              <p><strong>【${data.title}】</strong></p>
              <p style="margin-top: 8px;">${data.extract}</p>
            </div>
          `;
        } else {
          resultsArea.innerHTML = `<div class="error-msg">表示不可</div>`;
        }
      } else {
        resultsArea.innerHTML = `<div class="error-msg">表示不可</div>`;
      }
    } catch (e) {
      resultsArea.innerHTML = `<div class="error-msg">表示不可</div>`;
    }
  }

  /* WEBGPU & FPS GAME MODE ENGINE */
  let animId = null;
  let lastTime = performance.now();
  let frameCount = 0;

  function enableGameMode() {
    document.getElementById("gameOverlay").style.display = "block";
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    }
    startFPSLoop();
  }

  function disableGameMode() {
    document.getElementById("gameOverlay").style.display = "none";
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
    cancelAnimationFrame(animId);
  }

  function startFPSLoop() {
    const canvas = document.getElementById("gpuCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function render() {
      const now = performance.now();
      frameCount++;
      if (now - lastTime >= 1000) {
        document.getElementById("fpsDisplay").textContent = `FPS: ${frameCount} (GPU Max)`;
        frameCount = 0;
        lastTime = now;
      }
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      animId = requestAnimationFrame(render);
    }
    render();
  }
</script>
</body>
</html>
