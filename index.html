<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ローカルChatGPT-FREE</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 15px;
    }

    /* インストール画面 */
    .install-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .install-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 450px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #334155;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.2s ease;
    }

    .install-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
      word-break: break-all;
    }

    /* チャット画面 */
    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    header {
      padding: 15px 20px;
      background: #0f172a;
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
      color: var(--accent-color);
      display: flex;
      justify-content: space-between;
    }

    .chat-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 80%;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message.user { align-self: flex-end; background: #0284c7; color: white; }
    .message.ai { align-self: flex-start; background: #334155; color: var(--text-main); }

    .input-area {
      padding: 15px;
      background: #0f172a;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1; background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 12px 16px; color: white; outline: none;
    }

    button {
      background: var(--accent-color); color: #0f172a; border: none;
      font-weight: bold; padding: 0 20px; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>

<!-- インストール画面 -->
<div class="install-modal" id="installModal">
  <div class="install-card">
    <h2>🤖 ローカルChatGPT-FREE</h2>
    <p class="install-info" id="statusLabel" style="font-weight: bold; color: var(--accent-color);">初期化中...</p>
    
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <div class="install-info" id="detailLabel">AIモデルデータをブラウザにセットアップ中...</div>
  </div>
</div>

<!-- メインチャット画面 -->
<div class="chat-container">
  <header>
    <span>🤖 ローカルChatGPT-FREE</span>
    <span id="deviceMode" style="font-size: 0.75rem; color: var(--text-muted);"></span>
  </header>
  <div class="chat-area" id="chatArea">
    <div class="message ai">準備完了！何でも話しかけてね！✨</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
    <button onclick="handleSend()">送信</button>
  </div>
</div>

<script type="module">
  import * as webllm from "https://esm.run/@mlc-ai/web-llm";

  // スマホ判定（画面幅またはユーザーエージェント）
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
  
  // スマホなら軽量版(0.5B: 約400MB)、PCなら高精度版(1.5B: 約1.5GB)
  const selectedModel = isMobile 
    ? "Qwen2.5-0.5B-Instruct-q4f16_1-MLC" 
    : "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";

  document.getElementById("deviceMode").textContent = isMobile ? "📱 スマホ軽量モード" : "💻 PC高精度モード";

  let engine;
  const installModal = document.getElementById("installModal");
  const statusLabel = document.getElementById("statusLabel");
  const detailLabel = document.getElementById("detailLabel");
  const progressFill = document.getElementById("progressFill");

  let messages = [
    { role: "system", content: "あなたは親切なAIアシスタントです。日本語で答えてください。" }
  ];

  window.addEventListener("DOMContentLoaded", async () => {
    try {
      engine = await webllm.CreateMLCEngine(selectedModel, {
        initProgressCallback: (report) => {
          const progress = Math.floor(report.progress * 100);
          progressFill.style.width = `${progress}%`;
          statusLabel.textContent = `インストール中... ${progress}%`;
          detailLabel.textContent = report.text;
        }
      });

      // 完了したらモーダルを非表示
      installModal.style.display = "none";
    } catch (err) {
      statusLabel.textContent = "❌ エラーが発生しました";
      detailLabel.textContent = "お使いのスマホのブラウザがWebGPU非対応か、メモリ不足の可能性があります。Chrome等の最新版でお試しください。";
    }
  });

  window.handleSend = async function() {
    const userInput = document.getElementById("userInput");
    const text = userInput.value.trim();
    if (!text || !engine) return;

    appendMessage("user", text);
    messages.push({ role: "user", content: text });
    userInput.value = "";

    const aiMsgDiv = appendMessage("ai", "思考中...");

    try {
      const chunks = await engine.chat.completions.create({ messages, stream: true });
      let replyText = "";
      for await (const chunk of chunks) {
        replyText += chunk.choices[0]?.delta?.content || "";
        aiMsgDiv.textContent = replyText;
      }
      messages.push({ role: "assistant", content: replyText });
    } catch (e) {
      aiMsgDiv.textContent = "エラーが発生しました。";
    }
  };

  window.handleKeyPress = function(e) {
    if (e.key === "Enter") window.handleSend();
  };

  function appendMessage(type, text) {
    const chatArea = document.getElementById("chatArea");
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${type}`;
    msgDiv.textContent = text;
    chatArea.appendChild(msgDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
    return msgDiv;
  }
</script>

</body>
</html>
