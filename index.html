<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クロワルモニター</title>
  <style>
    :root {
      --primary-color: #007bff;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --sub-text: #666666;
      --instant-color: #ff4757;
      --hon-color: #2ed573;
      --jizen-color: #70a1ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 10px 0;
      color: #1e272e;
    }

    .loading {
      text-align: center;
      padding: 40px 0;
      color: var(--sub-text);
      font-weight: bold;
    }

    .survey-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      color: #fff;
    }

    .badge-hon {
      background-color: var(--hon-color);
    }

    .badge-jizen {
      background-color: var(--jizen-color);
    }

    .badge-instant {
      background-color: var(--instant-color);
    }

    .badge-deadline {
      background-color: #ffa502;
      margin-left: auto;
    }

    .survey-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin: 4px 0;
      line-height: 1.4;
    }

    .survey-meta {
      font-size: 0.85rem;
      color: var(--sub-text);
      background-color: #f8f9fa;
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
    }

    .meta-label {
      font-weight: bold;
    }

    .survey-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .points-info {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .points-val {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--instant-color);
    }

    .yen-val {
      font-size: 0.85rem;
      color: var(--sub-text);
    }

    .btn-answer {
      display: inline-block;
      background-color: var(--primary-color);
      color: #fff;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }

    .btn-answer:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>クロワルモニター</h1>
    </header>

    <div id="survey-list">
      <div class="loading">アンケート一覧を読み込み中...</div>
    </div>
  </div>

  <script>
    // ページ読み込み時にGASからアンケート一覧を取得
    document.addEventListener('DOMContentLoaded', () => {
      google.script.run
        .withSuccessHandler(renderSurveys)
        .withFailureHandler(handleError)
        .getSurveys();
    });

    function renderSurveys(surveys) {
      const container = document.getElementById('survey-list');
      container.innerHTML = '';

      if (!surveys || surveys.length === 0) {
        container.innerHTML = '<div class="loading">現在回答できるアンケートはありません。</div>';
        return;
      }

      surveys.forEach(survey => {
        const card = document.createElement('div');
        card.className = 'survey-card';

        // 種別バッジ（「本」または「事前」）
        const typeBadgeClass = survey.type === '本' ? 'badge-hon' : 'badge-jizen';
        let badgesHtml = `<span class="badge ${typeBadgeClass}">${survey.type}</span>`;

        // 即Pバッジ
        if (survey.isInstant) {
          badgesHtml += `<span class="badge badge-instant">即P</span>`;
        }

        // 期限バッジ
        if (survey.deadline) {
          badgesHtml += `<span class="badge badge-deadline">期限: ${escapeHtml(survey.deadline)}</span>`;
        }

        // メタ情報（獲得者 / 対象者）
        let metaHtml = '';
        if (survey.pointEarners || survey.targetUsers) {
          metaHtml = `<div class="survey-meta">`;
          if (survey.pointEarners) {
            metaHtml += `<div class="meta-row"><span class="meta-label">ポイント獲得者:</span> <span>${escapeHtml(survey.pointEarners)}</span></div>`;
          }
          if (survey.targetUsers) {
            metaHtml += `<div class="meta-row"><span class="meta-label">本アンケート対象者:</span> <span>${escapeHtml(survey.targetUsers)}</span></div>`;
          }
          metaHtml += `</div>`;
        }

        // リンクボタンの有無
        const linkBtnHtml = survey.link
          ? `<a href="${escapeHtml(survey.link)}" target="_blank" class="btn-answer">回答する</a>`
          : `<span style="color:#aaa; font-size:0.85rem;">準備中</span>`;

        card.innerHTML = `
          <div class="card-header">
            ${badgesHtml}
          </div>
          <div class="survey-title">${escapeHtml(survey.title)}</div>
          ${metaHtml}
          <div class="survey-footer">
            <div class="points-info">
              <span class="points-val">${escapeHtml(survey.points)}</span>
              <span class="yen-val">(${escapeHtml(survey.yenValue)})</span>
            </div>
            ${linkBtnHtml}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function handleError(error) {
      const container = document.getElementById('survey-list');
      container.innerHTML = `<div class="loading" style="color:red;">データの取得に失敗しました。<br>${escapeHtml(error.message)}</div>`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>

</body>
</html>
