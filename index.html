<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>クロワルモニター</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #1b4332;
      --primary-light: #2d6a4f;
      --accent: #b45309;       /* シックなアンバー */
      --instant-red: #991b1b;  /* 深みのある上質な赤 */
      --instant-bg: #fef2f2;   /* 薄い赤背景 */
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    /* ==================== ヘッダー & ハンバーガーメニュー ==================== */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      color: var(--text-main);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .menu-btn:hover {
      background: var(--bg);
    }

    /* スライド式ドロワーメニュー */
    .nav-drawer {
      position: fixed;
      top: 0;
      right: -280px;
      width: 280px;
      height: 100vh;
      background: var(--card-bg);
      box-shadow: -4px 0 20px rgba(0,0,0,0.1);
      z-index: 200;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
    }
    .nav-drawer.open {
      right: 0;
    }
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .drawer-menu {
      list-style: none;
    }
    .drawer-menu li a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .drawer-menu li a:hover {
      background: var(--bg);
    }

    /* ==================== メインレイアウト ==================== */
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
    }

    /* マイページステータス表示 */
    .profile-card {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .profile-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      opacity: 0.9;
      margin-bottom: 12px;
    }
    .monitor-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .points-display {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .points-val {
      font-size: 1.8rem;
      font-weight: 900;
      color: #fef08a;
    }
    .points-sub {
      font-size: 0.8rem;
      opacity: 0.85;
    }

    /* 登録フォーム（初回のみ表示） */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background-color: #f8fafc;
      outline: none;
    }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }

    /* ==================== アンケートカード ==================== */
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .survey-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }

    /* 【即P】の上質な強調デザイン（派手さを抑えた上質な仕上がり） */
    .survey-card.is-instant {
      border-left: 4px solid var(--instant-red);
      background: linear-gradient(90deg, var(--instant-bg) 0%, #ffffff 15%);
    }

    .survey-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .tag-instant {
      background: var(--instant-red);
      color: #fff;
    }
    .tag-normal {
      background: #e2e8f0;
      color: #475569;
    }

    .survey-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .survey-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }
    .reward-info {
      display: flex;
      flex-direction: column;
    }
    .reward-pt {
      font-size: 1rem;
      font-weight: 900;
      color: var(--accent);
    }
    .reward-yen {
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    .btn-answer {
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="brand-logo">
      <i class="fa-solid fa-clipboard-check"></i> クロワルモニター
    </div>
    <button class="menu-btn" onclick="toggleDrawer(true)">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <!-- ハンバーガーメニュー (ドロワー) -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer(false)"></div>
  <div class="nav-drawer" id="nav-drawer">
    <div class="drawer-header">
      <span style="font-weight:700;">メニュー</span>
      <button class="menu-btn" onclick="toggleDrawer(false)"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <ul class="drawer-menu">
      <li><a href="#" onclick="toggleDrawer(false);"><i class="fa-solid fa-house"></i> ホーム</a></li>
      <li><a href="#" onclick="toggleDrawer(false); loadSurveys();"><i class="fa-solid fa-rotate"></i> アンケート更新</a></li>
      <li><a href="#" onclick="resetProfile();"><i class="fa-solid fa-user-gear"></i> モニター情報リセット</a></li>
    </ul>
  </div>

  <div class="container">
    
    <!-- モニター情報未登録の場合の登録カード -->
    <div id="register-card" class="card hidden">
      <h3 style="font-size:1rem; margin-bottom:12px;">新規モニター登録</h3>
      <p style="font-size:0.75rem; color:var(--text-sub); margin-bottom:12px;">情報を入力すると、3桁のモニター番号が自動発行されます。</p>
      
      <div class="form-group">
        <label>お名前</label>
        <input type="text" id="reg-name" placeholder="例: 山田太郎">
      </div>
      <div class="form-group">
        <label>都道府県</label>
        <input type="text" id="reg-pref" placeholder="例: 東京都">
      </div>
      <div class="form-group">
        <label>年代</label>
        <select id="reg-age">
          <option value="">選択してください</option>
          <option value="10-20代">10〜20代</option>
          <option value="30-50代">30〜50代</option>
          <option value="60代以上">60代以上</option>
        </select>
      </div>
      <button class="btn-submit" onclick="submitRegister()">登録して開始する</button>
    </div>

    <!-- モニター情報ダッシュボード -->
    <div id="profile-card" class="profile-card hidden">
      <div class="profile-top">
        <span id="user-display-name">--- 様</span>
        <span class="monitor-badge" id="user-display-id">No.---</span>
      </div>
      <div class="points-display">
        <span class="points-val" id="user-display-points">0</span>
        <span class="points-sub">pt</span>
      </div>
    </div>

    <!-- アンケート一覧 -->
    <div class="section-title">
      <i class="fa-solid fa-list-check" style="color:var(--primary);"></i> 受信アンケート
    </div>
    <div id="survey-list">
      <!-- 動的挿入 -->
    </div>

  </div>

  <script>
    window.onload = function() {
      initApp();
    };

    // ハンバーガーメニュー開閉
    function toggleDrawer(open) {
      const drawer = document.getElementById('nav-drawer');
      const overlay = document.getElementById('drawer-overlay');
      if (open) {
        drawer.classList.add('open');
        overlay.classList.add('open');
      } else {
        drawer.classList.remove('open');
        overlay.classList.remove('open');
      }
    }

    // アプリ初期化
    function initApp() {
      const savedUser = JSON.parse(localStorage.getItem('kurowaru_monitor_user'));
      if (savedUser) {
        showProfile(savedUser);
      } else {
        document.getElementById('register-card').classList.remove('hidden');
      }
      loadSurveys();
    }

    // 登録実行（3桁自動生成）
    function submitRegister() {
      const name = document.getElementById('reg-name').value.trim();
      const pref = document.getElementById('reg-pref').value.trim();
      const age = document.getElementById('reg-age').value;

      if (!name || !pref || !age) {
        alert('すべての項目を入力してください。');
        return;
      }

      // 3桁の数字を自動生成 (100〜999)
      const random3Digit = Math.floor(100 + Math.random() * 900).toString();

      const user = {
        monitorId: random3Digit,
        name: name,
        prefecture: pref,
        ageGroup: age,
        points: 0
      };

      // サーバー（GAS）へデータ保存を要求
      google.script.run.withSuccessHandler(res => {
        localStorage.setItem('kurowaru_monitor_user', JSON.stringify(user));
        document.getElementById('register-card').classList.add('hidden');
        showProfile(user);
        alert(`登録が完了しました！\nあなたのモニター番号は 【 ${user.monitorId} 】 です。`);
      }).registerUser(user);
    }

    // プロフィール表示
    function showProfile(user) {
      document.getElementById('user-display-name').innerText = `${user.name} 様 (${user.prefecture})`;
      document.getElementById('user-display-id').innerText = `No.${user.monitorId}`;
      document.getElementById('user-display-points').innerText = Number(user.points || 0).toLocaleString();
      document.getElementById('profile-card').classList.remove('hidden');
    }

    // プロフィールリセット
    function resetProfile() {
      if (confirm('登録情報をリセットして再登録しますか？')) {
        localStorage.removeItem('kurowaru_monitor_user');
        location.reload();
      }
    }

    // アンケート一覧読み込み・描画
    function loadSurveys() {
      const container = document.getElementById('survey-list');
      container.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center; padding:20px;">アンケートを取得中...</p>';

      google.script.run.withSuccessHandler(surveys => {
        container.innerHTML = '';

        if (!surveys || surveys.length === 0) {
          container.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center; padding:20px;">現在回答可能なアンケートはありません。</p>';
          return;
        }

        surveys.forEach(s => {
          // タイトルが「【即P】」で始まるか判定
          const isInstant = s.title.startsWith('【即P】');
          
          // 10pt = 1円換算
          const points = Number(s.points) || 0;
          const yen = Math.floor(points / 10);

          const card = document.createElement('div');
          card.className = `survey-card ${isInstant ? 'is-instant' : ''}`;

          card.innerHTML = `
            <div class="survey-tags">
              ${isInstant ? '<span class="tag tag-instant"><i class="fa-solid fa-bolt"></i> 即時付与</span>' : '<span class="tag tag-normal">通常</span>'}
            </div>
            <div class="survey-title">${s.title}</div>
            <div class="survey-footer">
              <div class="reward-info">
                <span class="reward-pt"><i class="fa-solid fa-coins"></i> ${points.toLocaleString()} pt</span>
                <span class="reward-yen">（${yen.toLocaleString()}円相当 / 10pt=1円）</span>
              </div>
              ${s.link ? `<a href="${s.link}" target="_blank" rel="noopener noreferrer" class="btn-answer">回答する <i class="fa-solid fa-arrow-up-right-from-square"></i></a>` : ''}
            </div>
          `;

          container.appendChild(card);
        });
      }).getSurveys();
    }
  </script>
</body>
</html>
