<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ローカルChatGPT-FREE</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 10px;
    }

    .chat-container {
      width: 100%;
      max-width: 650px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    header {
      padding: 12px 15px;
      background: #0f172a;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title { font-weight: bold; color: var(--accent-color); font-size: 1.1rem; }

    .mode-selector {
      display: flex;
      gap: 5px;
      background: #1e293b;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      flex: 1;
      padding: 6px 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--accent-color);
      color: #0f172a;
    }

    .status-bar {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      padding: 0 5px;
    }

    .chat-area {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message.user { align-self: flex-end; background: #0284c7; color: white; }
    .message.ai { align-self: flex-start; background: #334155; color: var(--text-main); }
    .message.system-msg { align-self: center; background: #ef444422; border: 1px solid #ef4444; color: #fca5a5; font-size: 0.85rem; }

    .input-area {
      padding: 12px;
      background: #0f172a;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1; background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 10px 14px; color: white; outline: none;
    }

    .code-btn, .send-btn {
      background: var(--accent-color); color: #0f172a; border: none;
      font-weight: bold; padding: 0 15px; border-radius: 8px; cursor: pointer;
    }

    .code-btn { background: #475569; color: white; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="chat-container">
  <header>
    <div class="header-top">
      <div class="title">🤖 ローカルChatGPT-FREE</div>
      <button class="code-btn" onclick="promptCode()">コード入力</button>
    </div>

    <!-- モード選択 -->
    <div class="mode-selector">
      <button class="mode-btn active" id="btn-FLASH" onclick="setMode('FLASH')">FLASH</button>
      <button class="mode-btn" id="btn-FLASH_PLUS" onclick="setMode('FLASH_PLUS')">FLASH+</button>
      <button class="mode-btn" id="btn-PRO_AI" onclick="setMode('PRO_AI')">PRO AI</button>
      <button class="mode-btn" id="btn-PRO_PLUS" onclick="setMode('PRO_PLUS')">PRO+</button>
    </div>

    <div class="status-bar">
      <span id="planLabel">プラン: 無料モード</span>
      <span id="limitLabel">残通数: 100通 / 2時間</span>
    </div>
  </header>

  <div class="chat-area" id="chatArea">
    <div class="message ai">
      準備完了！モードを選んでメッセージを入力してください✨
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" id="sendBtn" onclick="handleSend()">送信</button>
  </div>
</div>

<script type="module">
  import * as webllm from "https://esm.run/@mlc-ai/web-llm";

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
  let currentMode = "FLASH";
  let isPremium = false;
  let proAiUsedCount = 0;
  let proPlusUsedCount = 0;
  let engine = null;

  // LocalStorage初期化
  function initStorage() {
    const now = Date.now();
    let resetTime = localStorage.getItem("resetTime");
    
    if (!resetTime || now > parseInt(resetTime)) {
      localStorage.setItem("resetTime", now + 2 * 60 * 60 * 1000); // 2時間後
      localStorage.setItem("usedCount", "0");
      localStorage.setItem("proAiCount", "0");
      localStorage.setItem("proPlusCount", "0");
    }
    
    isPremium = localStorage.getItem("isPremium") === "true";
    updateStatusUI();
  }

  function getUsedCount() { return parseInt(localStorage.getItem("usedCount") || "0"); }
  function setUsedCount(val) { localStorage.setItem("usedCount", val.toString()); }

  function updateStatusUI() {
    const used = getUsedCount();
    const max = isPremium ? 150 : 100;
    document.getElementById("planLabel").textContent = isPremium ? "🌟 プレミアム" : "無料モード";
    document.getElementById("limitLabel").textContent = `使用可能: ${max - used}/${max}通`;
  }

  window.setMode = function(mode) {
    currentMode = mode;
    document.querySelectorAll(".mode-btn").forEach(btn => btn.classList.remove("active"));
    document.getElementById(`btn-${mode.replace('+', '_PLUS')}`).classList.add("active");
  };

  window.promptCode = function() {
    const code = prompt("プレミアムコードを入力してください:");
    if (code === "5533") {
      isPremium = true;
      localStorage.setItem("isPremium", "true");
      alert("プレミアムモードが有効化されました！(2時間150通 / PRO+解禁)");
      updateStatusUI();
    } else if (code !== null) {
      alert("コードが正しくありません。");
    }
  };

  // WebLLMエンジン起動 (PCの場合のみ裏で2GBモデル読み込み)
  if (!isMobile) {
    webllm.CreateMLCEngine("Qwen2.5-1.5B-Instruct-q4f16_1-MLC").then(e => { engine = e; });
  }

  window.handleSend = async function() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    let used = getUsedCount();
    const maxCount = isPremium ? 150 : 100;

    // 制限チェック
    let cost = 1;
    if (currentMode === "PRO_AI") {
      cost = 3;
      let pCount = parseInt(localStorage.getItem("proAiCount") || "0");
      if (!isPremium && pCount >= 10) {
        appendMessage("system-msg", "無料モードでのPRO AI使用上限（10回）に達しました。");
        return;
      }
      localStorage.setItem("proAiCount", (pCount + 1).toString());
    } else if (currentMode === "PRO_PLUS") {
      if (!isPremium) {
        appendMessage("system-msg", "PRO+ はプレミアム限定機能です。コードを入力してください。");
        return;
      }
      let ppCount = parseInt(localStorage.getItem("proPlusCount") || "0");
      if (ppCount >= 50) {
        appendMessage("system-msg", "PRO+ の上限（50回）に達しました。");
        return;
      }
      localStorage.setItem("proPlusCount", (ppCount + 1).toString());
    }

    if (used + cost > maxCount) {
      appendMessage("system-msg", "2時間の送信上限に達しました。時間を置いてお試しください。");
      return;
    }

    setUsedCount(used + cost);
    updateStatusUI();

    appendMessage("user", text);
    input.value = "";

    const aiMsg = appendMessage("ai", "思考中...");

    // モードに応じた思考タイマー演出
    let delay = 1000;
    if (currentMode === "PRO_AI") delay = 17000;
    if (currentMode === "PRO_PLUS") delay = 15000;

    let startTime = Date.now();
    let timer = setInterval(() => {
      let elapsed = Date.now() - startTime;
      let percent = Math.min(100, Math.floor((elapsed / delay) * 100));
      if (currentMode === "PRO_AI" || currentMode === "PRO_PLUS") {
        aiMsg.textContent = `思考中... 回答文生成 ${percent}%`;
      }
    }, 200);

    setTimeout(async () => {
      clearInterval(timer);
      if (engine && !isMobile) {
        // PC版: 本物ローカルAIで一瞬生成
        try {
          const res = await engine.chat.completions.create({
            messages: [{ role: "user", content: text }]
          });
          aiMsg.textContent = res.choices[0].message.content;
        } catch(e) {
          aiMsg.textContent = "回答の生成に成功しました。（「" + text + "」に関する回答）";
        }
      } else {
        // スマホ版 / フォールバック: 軽量応答
        aiMsg.textContent = `【${currentMode} モード回答】\n「${text}」についてお答えします。非常にスムーズに処理が完了しました！`;
      }
    }, delay);
  };

  window.handleKeyPress = function(e) {
    if (e.key === "Enter") window.handleSend();
  };

  function appendMessage(type, text) {
    const chatArea = document.getElementById("chatArea");
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${type}`;
    msgDiv.textContent = text;
    chatArea.appendChild(msgDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
    return msgDiv;
  }

  initStorage();
</script>

</body>
</html>
