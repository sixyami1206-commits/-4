<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Local AI Chat</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
      padding: 15px;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    header {
      padding: 15px 20px;
      background: #0f172a;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-weight: bold;
      color: var(--accent-color);
    }

    .status-text {
      font-size: 0.8rem;
      color: var(--accent-color);
      max-width: 250px;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 80%;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #0284c7;
      color: white;
    }

    .message.ai {
      align-self: flex-start;
      background: #334155;
      color: var(--text-main);
    }

    .input-area {
      padding: 15px;
      background: #0f172a;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    button {
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      font-weight: bold;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <header>
    <div class="title">🤖 本格ローカルAI</div>
    <div class="status-text" id="statusText">初期化中...</div>
  </header>

  <div class="chat-area" id="chatArea">
    <div class="message ai" id="initMessage">
      初回のみAIモデルデータ（約1.5GB）をブラウザにダウンロードします。<br>
      準備完了までそのまま数分お待ちください...📦
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="AIの準備完了までお待ちください..." disabled onkeypress="handleKeyPress(event)">
    <button id="sendBtn" disabled onclick="handleSend()">送信</button>
  </div>
</div>

<script type="module">
  import * as webllm from "https://esm.run/@mlc-ai/web-llm";

  // 日本語の会話精度が非常に高い「Qwen2.5-1.5B」モデルを採用
  const selectedModel = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";
  let engine;

  const statusText = document.getElementById("statusText");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const initMessage = document.getElementById("initMessage");

  let messages = [
    { role: "system", content: "あなたはとても親切で頭の良いAIアシスタントです。自然で正しい日本語で会話してください。" }
  ];

  window.addEventListener("DOMContentLoaded", async () => {
    try {
      engine = await webllm.CreateMLCEngine(selectedModel, {
        initProgressCallback: (report) => {
          statusText.textContent = report.text;
        }
      });

      statusText.textContent = "🟢 準備完了";
      initMessage.textContent = "読み込み完了！ちゃんと会話できるようになりました！何でも聞いてね✨";
      userInput.placeholder = "メッセージを入力...";
      userInput.disabled = false;
      sendBtn.disabled = false;
    } catch (err) {
      statusText.textContent = "❌ エラー";
      initMessage.textContent = "お使いのブラウザ（または端末のメモリ）が不足しているか、WebGPUに対応していない可能性があります。Chrome等の最新版でお試しください。";
    }
  });

  window.handleSend = async function() {
    const text = userInput.value.trim();
    if (!text || !engine) return;

    appendMessage("user", text);
    messages.push({ role: "user", content: text });
    userInput.value = "";
    userInput.disabled = true;
    sendBtn.disabled = true;

    const aiMsgDiv = appendMessage("ai", "思考中...");

    try {
      const chunks = await engine.chat.completions.create({
        messages,
        stream: true
      });

      let replyText = "";
      for await (const chunk of chunks) {
        const content = chunk.choices[0]?.delta?.content || "";
        replyText += content;
        aiMsgDiv.textContent = replyText;
      }

      messages.push({ role: "assistant", content: replyText });
    } catch (e) {
      aiMsgDiv.textContent = "エラーが発生しました。";
    } finally {
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  };

  window.handleKeyPress = function(e) {
    if (e.key === "Enter") window.handleSend();
  };

  function appendMessage(type, text) {
    const chatArea = document.getElementById("chatArea");
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${type}`;
    msgDiv.textContent = text;
    chatArea.appendChild(msgDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
    return msgDiv;
  }
</script>

</body>
</html>
