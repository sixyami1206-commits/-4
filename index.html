<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>crawlWeb</title>
  
  <!-- Google Custom Search Engine Element -->
  <script async src="https://cse.google.com/cse.js?cx=0220ba049f4274edf"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .logo-container { text-align: center; }
    .logo-main {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo-sub { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; }

    /* SEARCH BAR UI */
    .search-box {
      width: 100%;
      max-width: 680px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box:focus-within { border-color: var(--accent); }

    input.search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
      padding: 6px 8px;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn:hover { border-color: var(--accent); }
    .btn-ai { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0f172a; border: none; }
    .game-mode-btn { background: rgba(56, 189, 248, 0.2); border-color: var(--accent); color: var(--accent); display: none; }

    /* RESULTS VIEWPORT */
    .content-viewport {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .results-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .result-card h3 { font-size: 1.1rem; margin-bottom: 6px; color: var(--accent); }
    .result-card p { color: #cbd5e1; font-size: 0.9rem; line-height: 1.6; }

    .error-msg { color: #f87171; font-weight: bold; text-align: center; padding: 40px 0; }

    /* GOOGLE CSE OVERRIDE STYLE */
    .gsc-control-cse {
      background-color: transparent !important;
      border: none !important;
      padding: 0 !important;
    }
    .gsc-search-button-v2 { display: none !important; }
    .gsc-input-box { display: none !important; }

    /* GAME MODE OVERLAY */
    .game-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000;
      display: none;
      z-index: 9999;
    }

    .game-controls {
      position: absolute;
      top: 16px; right: 16px;
      display: flex; gap: 12px; align-items: center;
      background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; border: 1px solid #333;
    }

    .fps-badge { color: #22c55e; font-size: 0.85rem; font-family: monospace; font-weight: bold; }
    .off-btn { background: #ef4444; color: #fff; border: none; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    canvas#gpuCanvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo-container">
      <div class="logo-main">crawlWeb</div>
      <div class="logo-sub">クロワルウェィブ</div>
    </div>

    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="検索キーワードを入力..." onkeydown="if(event.key==='Enter') execSearch('google')">
      <button class="btn" onclick="execSearch('google')">Google検索</button>
      <button class="btn btn-ai" onclick="execSearch('ai')">CrawlAI検索</button>
      <button class="btn game-mode-btn" id="gameBtn" onclick="enableGameMode()">🎮 ゲームモード</button>
    </div>
  </header>

  <!-- CONTENT VIEWPORT -->
  <div class="content-viewport">
    <div class="results-container" id="resultsArea">
      <div class="result-card">
        <h3>🚀 crawlWeb へようこそ</h3>
        <p>Googleカスタム検索機能（CX: 0220ba049f4274edf）を接続しました。「Google検索」でWeb検索結果をそのまま表示し、「CrawlAI検索」で「〜について」の自動要約を実行します。</p>
      </div>
      <!-- Google Custom Search Element Container -->
      <div class="gcse-searchresults-only" id="gcseContainer"></div>
    </div>
  </div>

  <!-- GAME MODE OVERLAY -->
  <div class="game-overlay" id="gameOverlay">
    <canvas id="gpuCanvas"></canvas>
    <div class="game-controls">
      <span class="fps-badge" id="fpsDisplay">FPS: -- (GPU Max)</span>
      <button class="off-btn" onclick="disableGameMode()">OFF</button>
    </div>
  </div>

<script>
  function showGameBtn() {
    document.getElementById("gameBtn").style.display = "inline-block";
  }

  function execSearch(type) {
    const rawVal = document.getElementById("searchInput").value.trim();
    const resultsArea = document.getElementById("resultsArea");

    if (!rawVal) return;

    showGameBtn();

    if (type === 'google') {
      // Google Custom Search Element へ検索クエリを発行
      resultsArea.innerHTML = '<div class="gcse-searchresults-only"></div>';
      
      if (window.google && window.google.search && window.google.search.cse) {
        const element = google.search.cse.element.getElement('gsearch');
        if (element) {
          element.execute(rawVal);
        } else {
          // 要素が初期化前の場合の直接URL制御
          const cseEl = document.querySelector('.gcse-searchresults-only');
          if (cseEl) {
            google.search.cse.element.render({
              div: cseEl,
              tag: 'searchresults-only'
            });
            const instance = google.search.cse.element.getElement(cseEl);
            if (instance) instance.execute(rawVal);
          }
        }
      } else {
        // 標準Google CSE呼び出しフォールバック
        const gcseBox = document.querySelector('.gcse-searchresults-only');
        if (gcseBox) {
          gcseBox.innerHTML = `<div class="result-card"><p>🔍 「${rawVal}」の検索結果を読み込み中...</p></div>`;
        }
        // Google CSEのクエリ実行
        const element = google.search.cse.element.getElement('searchresults-only0');
        if (element) element.execute(rawVal);
      }

    } else if (type === 'ai') {
      // CrawlAI検索（AI時のみ「〜について」を付与）
      const aiQuery = `${rawVal}について`;
      resultsArea.innerHTML = `<div class="result-card"><h3>🤖 CrawlAI: 「${aiQuery}」</h3><p>🔍 情報を解析・収集しています...</p></div>`;

      fetchCrawlAI(rawVal, aiQuery);
    }
  }

  /* CrawlAI Search Engine */
  async function fetchCrawlAI(rawVal, aiQuery) {
    const resultsArea = document.getElementById("resultsArea");
    try {
      const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(rawVal)}`);
      if (res.ok) {
        const data = await res.json();
        if (data.extract) {
          resultsArea.innerHTML = `
            <div class="result-card">
              <h3>🤖 CrawlAI: 「${aiQuery}」</h3>
              <p><strong>【${data.title}】</strong></p>
              <p style="margin-top: 8px;">${data.extract}</p>
            </div>
          `;
        } else {
          resultsArea.innerHTML = `<div class="error-msg">表示不可</div>`;
        }
      } else {
        resultsArea.innerHTML = `<div class="error-msg">表示不可</div>`;
      }
    } catch (e) {
      resultsArea.innerHTML = `<div class="error-msg">表示不可</div>`;
    }
  }

  /* WEBGPU & FPS GAME MODE ENGINE */
  let animId = null;
  let lastTime = performance.now();
  let frameCount = 0;

  function enableGameMode() {
    document.getElementById("gameOverlay").style.display = "block";
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    }
    startFPSLoop();
  }

  function disableGameMode() {
    document.getElementById("gameOverlay").style.display = "none";
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
    cancelAnimationFrame(animId);
  }

  function startFPSLoop() {
    const canvas = document.getElementById("gpuCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function render() {
      const now = performance.now();
      frameCount++;
      if (now - lastTime >= 1000) {
        document.getElementById("fpsDisplay").textContent = `FPS: ${frameCount} (GPU Max)`;
        frameCount = 0;
        lastTime = now;
      }
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      animId = requestAnimationFrame(render);
    }
    render();
  }
</script>
</body>
</html>
