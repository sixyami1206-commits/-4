<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Chat</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
      padding: 15px;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    header {
      padding: 15px 20px;
      background: #0f172a;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-weight: bold;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 80%;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #0284c7;
      color: white;
    }

    .message.ai {
      align-self: flex-start;
      background: #334155;
      color: var(--text-main);
    }

    .loading {
      align-self: flex-start;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-style: italic;
    }

    .input-area {
      padding: 15px;
      background: #0f172a;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    button {
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      font-weight: bold;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <header>
    <div class="title">💬 AIパートナー (キー不要)</div>
  </header>

  <div class="chat-area" id="chatArea">
    <div class="message ai">
      ヤッホー！何でも話しかけてね！✨
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
    <button id="sendBtn" onclick="handleSend()">送信</button>
  </div>
</div>

<script>
  // APIキー不要で使える公開フリーモデル（Hugging Face Inference API）
  const API_URL = "https://api-inference.huggingface.co/models/Qwen/Qwen2.5-Coder-32B-Instruct";

  async function handleSend() {
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const text = inputEl.value.trim();

    if (!text) return;

    // ユーザーメッセージを表示
    appendMessage("user", text);
    inputEl.value = '';
    sendBtn.disabled = true;

    // ローディング表示
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'loading';
    loadingDiv.id = 'loadingIndicator';
    loadingDiv.textContent = 'AIが考え中...💭';
    document.getElementById('chatArea').appendChild(loadingDiv);

    try {
      // APIキーなしでモデルに送信
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          inputs: `<|im_start|>system\nあなたは明るく親しみやすいAI友達です。日本語でフレンドリーに返答してください。<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`,
          parameters: { max_new_tokens: 300, return_full_text: false }
        })
      });

      const data = await response.json();
      document.getElementById('loadingIndicator').remove();

      if (data && data[0] && data[0].generated_text) {
        let reply = data[0].generated_text.replace("<|im_end|>", "").trim();
        appendMessage("ai", reply);
      } else {
        appendMessage("ai", "ごめんね、うまく言葉が出てこなかった！もう一回送ってみて！");
      }

    } catch (err) {
      document.getElementById('loadingIndicator')?.remove();
      appendMessage("ai", "通信エラーが起きちゃったかも。少し待って試してみてね。");
    } finally {
      sendBtn.disabled = false;
    }
  }

  function appendMessage(type, text) {
    const chatArea = document.getElementById('chatArea');
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${type}`;
    msgDiv.textContent = text;
    chatArea.appendChild(msgDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') handleSend();
  }
</script>

</body>
</html>
