<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>crawlWeb</title>
  
  <!-- Google公式検索エンジン スクリプト -->
  <script async src="https://cse.google.com/cse.js?cx=0220ba049f4274edf"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .logo-container { text-align: center; }
    .logo-main {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo-sub { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; }

    /* GOOGLE SEARCH CONTAINER */
    .search-wrapper {
      width: 100%;
      max-width: 700px;
      margin: 20px auto;
      padding: 0 16px;
    }

    /* Google標準デザインをダークモード化調整 */
    .gsc-control-cse {
      background-color: transparent !important;
      border: none !important;
      padding: 0 !important;
    }
    .gsc-search-box { margin-bottom: 20px !important; }
    .gsc-input-box {
      background: rgba(15, 23, 42, 0.8) !important;
      border: 1px solid var(--border) !important;
      border-radius: 20px !important;
    }
    input.gsc-input {
      color: #fff !important;
      background: transparent !important;
    }
    .gsc-search-button-v2 {
      background-color: var(--accent) !important;
      border-radius: 15px !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-main">crawlWeb</div>
      <div class="logo-sub">クロワルウェィブ</div>
    </div>
  </header>

  <div class="search-wrapper">
    <!-- Google公式の検索窓＆結果表示要素 -->
    <div class="gcse-search"></div>
  </div>

</body>
</html>
