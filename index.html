<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>crawlWeb</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* LOGO AREA */
    .logo-container {
      text-align: center;
      margin-bottom: 28px;
      transition: opacity 0.3s;
    }

    .logo-main {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 0.85rem;
      color: #94a3b8;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* SEARCH BAR (Google Style) */
    .search-box {
      width: 90%;
      max-width: 580px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: all 0.3s;
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .search-icon { font-size: 1.1rem; color: #64748b; }

    input.search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
      padding: 6px 0;
    }

    .game-mode-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.2s;
    }

    .game-mode-btn:active { transform: scale(0.95); }

    /* FAMOUS SITES SHORTCUTS */
    .shortcuts {
      display: flex;
      gap: 16px;
      margin-top: 32px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 500px;
      transition: opacity 0.3s;
    }

    .shortcut-icon {
      width: 48px;
      height: 48px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: var(--text);
    }

    .shortcut-icon:hover { border-color: var(--accent); transform: translateY(-3px); }

    /* GAME MODE OVERLAY */
    .game-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000;
      display: none;
      z-index: 9999;
    }

    .game-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #333;
    }

    .fps-badge {
      color: #22c55e;
      font-size: 0.85rem;
      font-weight: bold;
      font-family: monospace;
    }

    .off-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* WebGPU Canvas Effect for Game Mode */
    canvas#gpuCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 1. LOGO -->
  <div class="logo-container" id="logoArea">
    <div class="logo-main">crawlWeb</div>
    <div class="logo-sub">クロワルウェィブ</div>
  </div>

  <!-- 2. SEARCH BAR -->
  <div class="search-box" id="searchArea">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" placeholder="検索またはURLを入力..." onkeydown="if(event.key==='Enter') doSearch()">
    <button class="game-mode-btn" onclick="enableGameMode()">🎮 ゲームモード</button>
  </div>

  <!-- 3. SHORTCUTS -->
  <div class="shortcuts" id="shortcutArea">
    <a class="shortcut-icon" href="https://www.youtube.com" target="_blank" title="YouTube">▶️</a>
    <a class="shortcut-icon" href="https://x.com" target="_blank" title="X (Twitter)">𝕏</a>
    <a class="shortcut-icon" href="https://www.google.com" target="_blank" title="Google">🔍</a>
    <a class="shortcut-icon" href="https://www.amazon.co.jp" target="_blank" title="Amazon">🛒</a>
    <a class="shortcut-icon" href="https://github.com" target="_blank" title="GitHub">🐙</a>
  </div>

  <!-- 4. GAME MODE OVERLAY (WebGPU / High FPS) -->
  <div class="game-overlay" id="gameOverlay">
    <canvas id="gpuCanvas"></canvas>
    <div class="game-controls">
      <span class="fps-badge" id="fpsDisplay">FPS: -- (WebGPU Active)</span>
      <button class="off-btn" onclick="disableGameMode()">ゲームモード OFF</button>
    </div>
  </div>

<script>
  // SEARCH FUNCTION
  function doSearch() {
    const val = document.getElementById("searchInput").value.trim();
    if (!val) return;
    if (val.startsWith("http://") || val.startsWith("https://")) {
      window.location.href = val;
    } else {
      window.location.href = `https://duckduckgo.com/?q=${encodeURIComponent(val)}`;
    }
  }

  // WEBGPU & FPS GAME MODE ENGINE
  let animId = null;
  let lastTime = performance.now();
  let frameCount = 0;

  async function initWebGPU() {
    if (navigator.gpu) {
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (adapter) console.log("WebGPU Ready!");
      } catch (e) {
        console.warn("WebGPU fallback to Canvas2D");
      }
    }
  }

  function enableGameMode() {
    document.getElementById("gameOverlay").style.display = "block";
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    }
    startFPSLoop();
  }

  function disableGameMode() {
    document.getElementById("gameOverlay").style.display = "none";
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
    cancelAnimationFrame(animId);
  }

  function startFPSLoop() {
    const canvas = document.getElementById("gpuCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function render() {
      const now = performance.now();
      frameCount++;
      if (now - lastTime >= 1000) {
        document.getElementById("fpsDisplay").textContent = `FPS: ${frameCount} (Max GPU Boost)`;
        frameCount = 0;
        lastTime = now;
      }

      // Minimal background loop
      ctx.fillStyle = "#050811";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      animId = requestAnimationFrame(render);
    }
    render();
  }

  initWebGPU();
</script>
</body>
</html>
