<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Local Web - COOL AI</title>
  <style>
    :root {
      --bg-color: #131314;
      --card-bg: #1e1f20;
      --user-msg: #2b2c2e;
      --accent: #a8c7fa;
      --text: #e3e2e6;
      --muted: #8e918f;
      --border: #444746;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', sans-serif, system-ui; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      height: 100vh;
      padding: 0;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
    }

    header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #1e1f20;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: bold;
      background: linear-gradient(135deg, #7cacf8, #f87171, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .model-select-box {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    select.model-dropdown {
      background: #131314;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      outline: none;
    }

    .action-buttons {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .action-btn {
      background: #282a2c;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 14px;
      font-size: 0.75rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .action-btn:active {
      background: var(--accent);
      color: #000;
    }

    .status-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--muted);
      padding: 0 2px;
    }

    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 90%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-msg);
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      align-self: flex-start;
      background: transparent;
      padding-left: 0;
    }

    .msg.system {
      align-self: center;
      background: #3c1e1e;
      color: #f87171;
      font-size: 0.8rem;
    }

    pre {
      background: #000;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      font-family: monospace;
      color: #38bdf8;
    }

    .generated-img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 8px;
      border: 1px solid var(--border);
    }

    .input-box {
      padding: 10px 12px;
      background: var(--bg-color);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      background: #1e1f20;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 12px 18px;
      color: var(--text);
      outline: none;
      font-size: 0.9rem;
    }

    .send-btn {
      background: var(--accent);
      color: #040e15;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .code-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="header-top">
      <div class="logo">✨ Gemini Local</div>
      <div class="model-select-box">
        <select class="model-dropdown" id="modelSelect" onchange="onModelChange()">
          <option value="COOL_AI">⚡ COOL AI (完全無料 / コードが得意)</option>
          <option value="FLASH">🚀 FLASH (高速応答)</option>
          <option value="FLASH_PLUS">⚡ FLASH+ (高精度)</option>
          <option value="PRO_AI">🧠 PRO AI (17秒高度思考)</option>
          <option value="PRO_PLUS">🌟 PRO+ (15秒最高品質)</option>
        </select>
        <button class="code-btn" onclick="enterCode()">コード入力</button>
      </div>
    </div>

    <!-- 機能ショートカットボタン -->
    <div class="action-buttons">
      <button class="action-btn" onclick="setAction('画像生成')">🖼️ 画像生成</button>
      <button class="action-btn" onclick="setAction('コード生成')">💻 コード生成</button>
      <button class="action-btn" onclick="setAction('雑談')">🗣️ 雑談</button>
      <button class="action-btn" onclick="setAction('しりとり')">🎈 しりとり</button>
      <button class="action-btn" onclick="setAction('天気')">☀️ 天気確認</button>
    </div>

    <div class="status-info">
      <span id="planStatus">無料モード</span>
      <span id="usageStatus">残通数: 100通 / 2時間</span>
    </div>
  </header>

  <div class="chat-box" id="chatBox">
    <div class="msg ai">
      準備完了！モデルを選んで質問してください。「COOL AI」はコード作成に便利です！✨
    </div>
  </div>

  <div class="input-box">
    <input type="text" id="userInput" placeholder="メッセージを入力または上のボタンを選択..." onkeypress="onKey(event)">
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
  let isPremium = false;

  function init() {
    const now = Date.now();
    let reset = localStorage.getItem("resetTime");
    if (!reset || now > parseInt(reset)) {
      localStorage.setItem("resetTime", now + 2 * 60 * 60 * 1000);
      localStorage.setItem("used", "0");
      localStorage.setItem("proAi", "0");
      localStorage.setItem("proPlus", "0");
    }
    isPremium = localStorage.getItem("isPremium") === "true";
    updateUI();
  }

  function updateUI() {
    const used = parseInt(localStorage.getItem("used") || "0");
    const max = isPremium ? 150 : 100;
    document.getElementById("planStatus").textContent = isPremium ? "🌟 プレミアム" : "無料モード";
    document.getElementById("usageStatus").textContent = `使用可能: ${max - used}/${max}通`;
  }

  function enterCode() {
    const c = prompt("プレミアムコードを入力:");
    if (c === "5533") {
      isPremium = true;
      localStorage.setItem("isPremium", "true");
      alert("プレミアムモード解放！(150通/2時間・PRO+制限解除)");
      updateUI();
    }
  }

  function setAction(type) {
    const input = document.getElementById("userInput");
    if (type === '画像生成') input.value = "サイバーパンクな街並みの画像を描いて";
    if (type === 'コード生成') input.value = "HTML/JSでボタンを押すとカウントが増えるプログラムコードを作って";
    if (type === '雑談') input.value = "最近おもしろかったことや雑談をしよう！";
    if (type === 'しりとり') input.value = "しりとりをしよう！「りんご」からね！";
    if (type === '天気') input.value = "東京の明日の天気を教えて";
    input.focus();
  }

  function onModelChange() {
    const m = document.getElementById("modelSelect").value;
    if (m === "COOL_AI") {
      addMsg("system", "「COOL AI」モードが選択されました。完全無料・コード記述が爆速で実行可能です。");
    }
  }

  async function fetchAIResponse(promptText, mode) {
    // API経由でリアルタイム会話取得
    const systemPrompt = (mode === "COOL_AI") 
      ? "あなたは高度なプログラミングと一般的な会話が得意なエンジニアAIです。コードは必ずマークダウンコードブロックで記述してください。"
      : "あなたは優秀で親切な日本語AIアシスタントです。";

    const url = `https://text.pollinations.ai/${encodeURIComponent(promptText)}?model=openai&system=${encodeURIComponent(systemPrompt)}`;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("API Error");
      return await res.text();
    } catch (e) {
      return "一時的に応答が取得できませんでした。時間をおいて再送信してください。";
    }
  }

  async function sendMsg() {
    const input = document.getElementById("userInput");
    const txt = input.value.trim();
    if (!txt) return;

    const mode = document.getElementById("modelSelect").value;

    let used = parseInt(localStorage.getItem("used") || "0");
    const max = isPremium ? 150 : 100;
    let cost = (mode === "PRO_AI") ? 3 : 1;

    if (mode === "PRO_AI" && !isPremium && parseInt(localStorage.getItem("proAi")||"0") >= 10) {
      addMsg("system", "PRO AI の無料回数上限（10回）に達しました。");
      return;
    }
    if (mode === "PRO_PLUS" && !isPremium) {
      addMsg("system", "PRO+ はプレミアム限定機能です。コード「5533」を入力してください。");
      return;
    }

    if (used + cost > max) {
      addMsg("system", "2時間の制限に達しました。時間をおいてご利用ください。");
      return;
    }

    localStorage.setItem("used", (used + cost).toString());
    if (mode === "PRO_AI") localStorage.setItem("proAi", (parseInt(localStorage.getItem("proAi")||"0")+1).toString());
    updateUI();

    addMsg("user", txt);
    input.value = "";

    const aiDiv = addMsg("ai", "思考中...");

    // 応答待機時間の設定
    let delay = 600;
    if (mode === "FLASH_PLUS") delay = 2500;
    if (mode === "PRO_AI") delay = 17000;
    if (mode === "PRO_PLUS") delay = 15000;

    let start = Date.now();
    let timer = setInterval(() => {
      if (mode === "PRO_AI" || mode === "PRO_PLUS") {
        let p = Math.min(100, Math.floor(((Date.now() - start) / delay) * 100));
        aiDiv.textContent = `思考中... 回答文生成 ${p}%`;
      }
    }, 200);

    setTimeout(async () => {
      clearInterval(timer);
      
      // 画像生成判定
      if (txt.includes("画像") || txt.includes("描いて") || txt.includes("イラスト")) {
        aiDiv.textContent = "要求に基づいて画像を生成しました！";
        const img = document.createElement("img");
        const cleanPrompt = encodeURIComponent(txt.replace(/(画像|描いて|イラスト|の|作って)/g, ""));
        img.src = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=512&height=512&nologo=true`;
        img.className = "generated-img";
        aiDiv.appendChild(img);
        return;
      }

      // 天気確認の注意書き補助
      let finalPrompt = txt;
      if (txt.includes("天気")) {
        finalPrompt += " (注意: リアルタイムの最新気象情報をふまえて親切に回答してください)";
      }

      // AIテキスト生成呼び出し
      const reply = await fetchAIResponse(finalPrompt, mode);
      
      // マークダウンコード整形表示
      if (reply.includes("```")) {
        const formatted = reply.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
        aiDiv.innerHTML = formatted;
      } else {
        aiDiv.textContent = reply;
      }
    }, delay);
  }

  function onKey(e) { if (e.key === "Enter") sendMsg(); }

  function addMsg(type, content) {
    const box = document.getElementById("chatBox");
    const d = document.createElement("div");
    d.className = `msg ${type}`;
    d.textContent = content;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    return d;
  }

  init();
</script>
</body>
</html>
