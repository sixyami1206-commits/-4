<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>crawlWeb</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER AREA */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-main {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* SEARCH BAR & FIXED SUFFIX */
    .search-box {
      width: 100%;
      max-width: 650px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box:focus-within { border-color: var(--accent); }

    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: transparent;
    }

    input.search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.95rem;
      padding: 8px 0;
      text-align: right;
    }

    .fixed-suffix {
      color: var(--accent);
      font-weight: bold;
      font-size: 0.95rem;
      user-select: none;
      padding-left: 4px;
      white-space: nowrap;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-ai { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #000; border: none; }
    .game-mode-btn { background: rgba(56, 189, 248, 0.2); border-color: var(--accent); color: var(--accent); display: none; }

    /* SHORTCUTS */
    .shortcuts {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      width: 100%;
      max-width: 650px;
      justify-content: center;
    }

    .shortcut-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }

    /* MAIN CONTENT VIEW (IFRAME & CrawlAI) */
    .content-viewport {
      flex: 1;
      width: 100%;
      position: relative;
      background: #000;
    }

    iframe#webFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: none;
    }

    .ai-result-panel {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-color);
      padding: 24px;
      overflow-y: auto;
      display: flex;
      justify-content: center;
    }

    .ai-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 750px;
      height: fit-content;
      line-height: 1.7;
    }

    .ai-card h3 { color: var(--accent); margin-bottom: 12px; }

    /* GAME MODE OVERLAY */
    .game-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000;
      display: none;
      z-index: 9999;
    }

    .game-controls {
      position: absolute;
      top: 16px; right: 16px;
      display: flex; gap: 12px; align-items: center;
      background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; border: 1px solid #333;
    }

    .fps-badge { color: #22c55e; font-size: 0.85rem; font-family: monospace; font-weight: bold; }
    .off-btn { background: #ef4444; color: #fff; border: none; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    canvas#gpuCanvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <!-- HEADER / TOOLBAR -->
  <header>
    <div class="logo-container">
      <span class="logo-main">crawlWeb</span>
      <span class="logo-sub">クロワルウェィブ</span>
    </div>

    <!-- SEARCH BAR -->
    <div class="search-box">
      <div class="input-wrapper">
        <input type="text" class="search-input" id="searchInput" placeholder="単語を入力" onkeydown="if(event.key==='Enter') execSearch('duck')">
        <span class="fixed-suffix">について</span>
      </div>
      <button class="btn" onclick="execSearch('duck')">検索</button>
      <button class="btn btn-ai" onclick="execSearch('ai')">CrawlAI検索</button>
      <button class="btn game-mode-btn" id="gameBtn" onclick="enableGameMode()">🎮 ゲームモード</button>
    </div>

    <!-- FAMOUS SITES -->
    <div class="shortcuts">
      <button class="shortcut-btn" onclick="openUrl('https://www.wikipedia.org')">Wikipedia</button>
      <button class="shortcut-btn" onclick="openUrl('https://www.youtube.com')">YouTube</button>
      <button class="shortcut-btn" onclick="openUrl('https://x.com')">𝕏</button>
      <button class="shortcut-btn" onclick="openUrl('https://www.google.com')">Google</button>
      <button class="shortcut-btn" onclick="openUrl('https://github.com')">GitHub</button>
    </div>
  </header>

  <!-- CONTENT VIEW (In-Site Browser / CrawlAI) -->
  <div class="content-viewport">
    <iframe id="webFrame"></iframe>
    <div class="ai-result-panel" id="aiPanel">
      <div class="ai-card">
        <h3 id="aiTitle">🤖 CrawlAI 検索</h3>
        <div id="aiBody">単語を入力して「CrawlAI検索」を押すと、Wikipediaから情報を収集して要約表示します。</div>
      </div>
    </div>
  </div>

  <!-- GAME MODE OVERLAY -->
  <div class="game-overlay" id="gameOverlay">
    <canvas id="gpuCanvas"></canvas>
    <div class="game-controls">
      <span class="fps-badge" id="fpsDisplay">FPS: -- (GPU Max)</span>
      <button class="off-btn" onclick="disableGameMode()">OFF</button>
    </div>
  </div>

<script>
  /* SEARCH & IN-SITE DISPLAY */
  function getFullQuery() {
    const keyword = document.getElementById("searchInput").value.trim();
    if (!keyword) return "";
    return `${keyword}について`;
  }

  function showGameBtn() {
    document.getElementById("gameBtn").style.display = "inline-block";
  }

  function openUrl(url) {
    showGameBtn();
    document.getElementById("aiPanel").style.display = "none";
    const iframe = document.getElementById("webFrame");
    iframe.style.display = "block";
    iframe.src = url;
  }

  function execSearch(type) {
    const fullQuery = getFullQuery();
    if (!fullQuery) return;

    showGameBtn(); // 検索したらゲームボタンを表示

    if (type === 'duck') {
      const searchUrl = `https://duckduckgo.com/?q=${encodeURIComponent(fullQuery)}`;
      openUrl(searchUrl);
    } else if (type === 'ai') {
      document.getElementById("webFrame").style.display = "none";
      document.getElementById("aiPanel").style.display = "flex";
      fetchCrawlAI();
    }
  }

  /* CrawlAI SEARCH (Wikipedia API) */
  async function fetchCrawlAI() {
    const rawWord = document.getElementById("searchInput").value.trim();
    const fullQuery = getFullQuery();
    const titleEl = document.getElementById("aiTitle");
    const bodyEl = document.getElementById("aiBody");

    titleEl.textContent = `🤖 CrawlAI: 「${fullQuery}」`;
    bodyEl.textContent = "🔍 Wikipediaから情報を収集・生成中...";

    if (!rawWord) {
      bodyEl.textContent = "表示不可";
      return;
    }

    try {
      // Wikipedia REST API
      const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(rawWord)}`);
      if (res.ok) {
        const data = await res.json();
        if (data.extract) {
          bodyEl.innerHTML = `<p><strong>【${data.title}について】</strong></p><p style="margin-top:8px;">${data.extract}</p>`;
        } else {
          bodyEl.textContent = "表示不可";
        }
      } else {
        bodyEl.textContent = "表示不可";
      }
    } catch (e) {
      bodyEl.textContent = "表示不可";
    }
  }

  /* WEBGPU & FPS GAME MODE ENGINE */
  let animId = null;
  let lastTime = performance.now();
  let frameCount = 0;

  function enableGameMode() {
    document.getElementById("gameOverlay").style.display = "block";
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    }
    startFPSLoop();
  }

  function disableGameMode() {
    document.getElementById("gameOverlay").style.display = "none";
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
    cancelAnimationFrame(animId);
  }

  function startFPSLoop() {
    const canvas = document.getElementById("gpuCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function render() {
      const now = performance.now();
      frameCount++;
      if (now - lastTime >= 1000) {
        document.getElementById("fpsDisplay").textContent = `FPS: ${frameCount} (GPU Max)`;
        frameCount = 0;
        lastTime = now;
      }
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      animId = requestAnimationFrame(render);
    }
    render();
  }
</script>
</body>
</html>
