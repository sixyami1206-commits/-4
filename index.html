<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crawlモニター</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(21, 29, 46, 0.85);
      --card-border: rgba(56, 189, 248, 0.2);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --accent: #fbbf24;
      --accent-glow: rgba(251, 191, 36, 0.4);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(251, 191, 36, 0.08) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-title {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .menu-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 10px;
      transition: all 0.2s;
    }
    .menu-btn:hover { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }

    /* MAIN CONTAINER */
    main { flex: 1; padding: 20px 16px; max-width: 640px; margin: 0 auto; width: 100%; }

    /* POINT STATUS BOARD */
    .point-board {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      padding: 20px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      margin-bottom: 24px;
    }

    .point-values {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .point-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      padding: 14px;
      border-radius: 12px;
      text-align: center;
    }

    .point-box .label { font-size: 0.75rem; color: var(--text-sub); font-weight: 700; margin-bottom: 6px; }
    .point-box .value { font-size: 1.5rem; font-weight: 900; color: var(--primary); text-shadow: 0 0 12px var(--primary-glow); }
    .point-box .value.pending { color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }

    .exchange-action-btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .exchange-action-btn:active { transform: scale(0.98); }

    /* DRAWER MENU */
    .drawer-overlay {
      position: fixed; top:0; left:0; width:100vw; height:100vh;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; z-index: 200;
    }
    .drawer {
      position: fixed; top:0; right:-300px; width:300px; height:100vh;
      background: #0f172a; border-left: 1px solid var(--card-border); z-index: 201; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 24px 20px; display: flex; flex-direction: column; gap: 20px;
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }
    .drawer.open { right: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 14px; }
    .drawer-title { font-weight: 800; color: var(--primary); font-size: 1.1rem; }
    .close-btn { background: none; border: none; font-size: 1.4rem; color: var(--text-sub); cursor: pointer; }

    .user-info-card {
      background: rgba(30, 41, 59, 0.6); border: 1px solid var(--card-border); padding: 16px; border-radius: 12px; font-size: 0.85rem; line-height: 1.8;
    }

    .drawer-menu-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .drawer-btn {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; border: none; border-radius: 8px;
      font-weight: 800; cursor: pointer; text-align: center; box-shadow: 0 4px 12px var(--primary-glow);
    }

    /* INITIAL SURVEY FORM */
    .init-survey-card {
      background: var(--card-bg);
      border: 1px solid var(--primary);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 0 20px var(--primary-glow);
    }
    .init-survey-card h2 { font-size: 1.2rem; color: var(--primary); margin-bottom: 16px; text-align: center; font-weight: 800; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 10px 12px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.9rem; color: var(--text);
    }
    .form-group input[readonly] { background: rgba(51, 65, 85, 0.5); color: var(--text-sub); }
    .form-check { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; margin: 18px 0; color: var(--text-sub); }
    .submit-btn {
      width: 100%; background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; border: none; padding: 12px;
      border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 15px var(--primary-glow);
    }

    /* SURVEY LIST SECTIONS */
    .section-title {
      font-size: 1rem; font-weight: 900; color: var(--text);
      margin: 24px 0 12px; padding-left: 10px; border-left: 4px solid var(--primary);
      display: flex; justify-content: space-between; align-items: center;
    }

    .survey-list { display: flex; flex-direction: column; gap: 12px; }

    .survey-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s, transform 0.2s;
    }
    .survey-card:hover { border-color: var(--primary); transform: translateY(-2px); }

    .survey-info { flex: 1; padding-right: 12px; }
    .survey-name { font-size: 0.95rem; font-weight: 700; margin-bottom: 6px; color: var(--text); }
    .survey-point { font-size: 0.9rem; color: var(--primary); font-weight: 800; }

    .survey-action .btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; border: none; padding: 8px 16px;
      border-radius: 20px; font-size: 0.8rem; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-block;
      box-shadow: 0 2px 10px var(--primary-glow);
    }
    .survey-action .btn.done { background: #475569; box-shadow: none; cursor: not-allowed; color: #94a3b8; }
    .survey-action .btn.pending-btn { background: var(--accent); box-shadow: 0 2px 10px var(--accent-glow); cursor: not-allowed; color: #0f172a; }

    /* MODAL */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 300; padding: 16px;
    }
    .modal {
      background: #0f172a; border: 1px solid var(--card-border); border-radius: 16px; padding: 24px; max-width: 400px; width: 100%; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal h3 { font-size: 1.15rem; margin-bottom: 14px; color: var(--primary); font-weight: 800; }
    .modal p { font-size: 0.85rem; margin-bottom: 18px; line-height: 1.6; color: var(--text-sub); }
    .modal-btn-group { display: flex; gap: 10px; }
    .modal-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; }
    .modal-btn.cancel { background: #334155; color: var(--text); }
    .modal-btn.go { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; box-shadow: 0 4px 12px var(--primary-glow); }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <span class="logo-title">Crawlモニター</span>
    </div>
    <button class="menu-btn" onclick="toggleDrawer(true)">☰</button>
  </header>

  <main>
    <div class="point-board">
      <div class="point-values">
        <div class="point-box">
          <div class="label">獲得Point</div>
          <div class="value" id="earnedPoint">0 pt</div>
        </div>
        <div class="point-box">
          <div class="label">判定中Point</div>
          <div class="value pending" id="pendingPoint">0 pt</div>
        </div>
      </div>
      <button class="exchange-action-btn" onclick="openExchangeModal()">ポイント交換申請（10pt〜）</button>
    </div>

    <!-- INITIAL REGISTRATION SURVEY -->
    <div class="init-survey-card" id="initSurveyCard" style="display: none;">
      <h2>初回登録アンケート</h2>
      <div class="form-group">
        <label>個人番号（ID）</label>
        <input type="text" id="regId" readonly>
      </div>
      <div class="form-group">
        <label>お名前</label>
        <input type="text" id="regName" placeholder="例: 山田 太郎">
      </div>
      <div class="form-group">
        <label>年齢</label>
        <input type="number" id="regAge" placeholder="例: 25">
      </div>
      <div class="form-group">
        <label>都道府県</label>
        <input type="text" id="regPref" placeholder="例: 東京都">
      </div>
      <div class="form-check">
        <input type="checkbox" id="regConfirm">
        <label for="regConfirm">個人番号を確認の上、アンケートを行います</label>
      </div>
      <button class="submit-btn" onclick="submitInitSurvey()">登録を完了してはじめる</button>
    </div>

    <!-- PRELIMINARY SURVEYS -->
    <div class="section-title">事前アンケート</div>
    <div class="survey-list" id="preliminaryList">
      <div style="font-size:0.85rem; color:var(--text-sub); text-align:center; padding:12px;">読み込み中...</div>
    </div>

    <!-- MAIN SURVEYS -->
    <div class="section-title">本アンケート</div>
    <div class="survey-list" id="mainList">
      <div style="font-size:0.85rem; color:var(--text-sub); text-align:center; padding:12px;">読み込み中...</div>
    </div>
  </main>

  <!-- DRAWER MENU -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="drawer-title">メニュー</span>
      <button class="close-btn" onclick="toggleDrawer(false)">✕</button>
    </div>
    <div class="user-info-card" id="userInfoDisplay">
      未登録です
    </div>
    <div class="drawer-menu-list">
      <button class="drawer-btn" onclick="toggleDrawer(false); openExchangeModal();">ポイント交換申請</button>
    </div>
  </div>

  <!-- CONFIRM MODAL -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h3 id="modalTitle">アンケート回答確認</h3>
      <p id="modalMsg"></p>
      <div class="modal-btn-group" id="modalBtnGroup"></div>
    </div>
  </div>

  <!-- EXCHANGE MODAL -->
  <div class="modal-overlay" id="exchangeModal">
    <div class="modal">
      <h3>ポイント交換申請</h3>
      <p style="text-align: left; font-size: 0.85rem; margin-bottom: 12px; color: var(--text-sub);">
        ※交換は<strong>10pt以上</strong>かつ<strong>獲得ポイントの範囲内</strong>で申請可能です。<br><br>
        交換方法は、当社に申請してから確認してください。「申請」を押すとメールアプリが自動起動します。
      </p>
      <div class="form-group">
        <label>交換希望ポイント数（最低 10 pt）</label>
        <input type="number" id="exchangePtsInput" placeholder="例: 10" min="10">
      </div>
      <div class="modal-btn-group" style="margin-top: 18px;">
        <button class="modal-btn cancel" onclick="closeExchangeModal()">キャンセル</button>
        <button class="modal-btn go" onclick="execExchangeEmail()">申請（メール起動）</button>
      </div>
    </div>
  </div>

<script>
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1bfvvx6bgTkHYvFyZxpSFS-HsuqhOThr5RAsJ39Bgxvo/export?format=csv';

  let userData = JSON.parse(localStorage.getItem('crawl_user_data')) || null;
  let answeredState = JSON.parse(localStorage.getItem('crawl_answered_state')) || {}; 

  let currentEarnedPoint = 0;

  function getOrGenerateID() {
    if (userData && userData.id) return userData.id;
    let savedId = localStorage.getItem('crawl_user_id');
    if (!savedId) {
      savedId = String(Math.floor(100 + Math.random() * 900));
      localStorage.setItem('crawl_user_id', savedId);
    }
    return savedId;
  }

  const userId = getOrGenerateID();

  window.addEventListener('DOMContentLoaded', () => {
    checkRegistration();
    fetchSpreadsheetData();
    // 10秒ごとに自動更新
    setInterval(fetchSpreadsheetData, 10000);
  });

  function checkRegistration() {
    if (!userData) {
      document.getElementById('initSurveyCard').style.display = 'block';
      document.getElementById('regId').value = userId;
      updateDrawerInfo();
    } else {
      document.getElementById('initSurveyCard').style.display = 'none';
      updateDrawerInfo();
    }
  }

  function submitInitSurvey() {
    const name = document.getElementById('regName').value.trim();
    const age = document.getElementById('regAge').value.trim();
    const pref = document.getElementById('regPref').value.trim();
    const confirm = document.getElementById('regConfirm').checked;

    if (!name || !age || !pref) {
      alert('すべての項目を入力してください。');
      return;
    }
    if (!confirm) {
      alert('「個人番号を確認の上〜」のチェックボックスにチェックを入れてください。');
      return;
    }

    userData = { id: userId, name, age, pref };
    localStorage.setItem('crawl_user_data', JSON.stringify(userData));
    alert('登録が完了しました！');
    document.getElementById('initSurveyCard').style.display = 'none';
    updateDrawerInfo();
  }

  function updateDrawerInfo() {
    const display = document.getElementById('userInfoDisplay');
    if (userData) {
      display.innerHTML = `
        <div><strong>ユーザー番号:</strong> ${userData.id}</div>
        <div><strong>お名前:</strong> ${userData.name}</div>
        <div><strong>年齢:</strong> ${userData.age} 歳</div>
        <div><strong>都道府県:</strong> ${userData.pref}</div>
      `;
    } else {
      display.innerHTML = `<div><strong>ユーザー番号:</strong> ${userId} (未登録)</div>`;
    }
  }

  function toggleDrawer(open) {
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('drawerOverlay');
    if (open) {
      drawer.classList.add('open');
      overlay.style.display = 'block';
    } else {
      drawer.classList.remove('open');
      overlay.style.display = 'none';
    }
  }

  function parseCSV(text) {
    const lines = text.split('\n');
    return lines.map(line => {
      const result = [];
      let cell = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) {
          result.push(cell.trim());
          cell = '';
        } else { cell += c; }
      }
      result.push(cell.trim());
      return result;
    });
  }

  async function fetchSpreadsheetData() {
    try {
      const res = await fetch(SHEET_CSV_URL + '&t=' + new Date().getTime());
      const text = await res.text();
      const rows = parseCSV(text);
      const dataRows = rows.slice(1);
      renderSurveys(dataRows);
    } catch (e) {
      console.error('Data update error:', e);
    }
  }

  function renderSurveys(rows) {
    const preContainer = document.getElementById('preliminaryList');
    const mainContainer = document.getElementById('mainList');

    preContainer.innerHTML = '';
    mainContainer.innerHTML = '';

    let totalEarned = 0;
    let totalPending = 0;

    let preCount = 0;
    let mainCount = 0;

    rows.forEach(row => {
      if (!row[0]) return;

      const name = row[0];
      const point = parseInt(row[1]) || 0;
      const type = row[2];
      const link = row[3];
      const eColumn = row[4] || '';
      const fColumn = row[5] || '';

      const checkIDInString = (str, targetId) => {
        if (!str) return false;
        const tokens = str.split(/[、,]/).map(s => s.trim());
        return tokens.includes(targetId);
      };

      const isConfirmedInSheet = checkIDInString(eColumn, userId);

      if (isConfirmedInSheet) {
        answeredState[name] = 'earned';
      }

      const currentState = answeredState[name];

      if (currentState === 'earned') {
        totalEarned += point;
      } else if (currentState === 'pending') {
        totalPending += point;
      }

      if (type === '本') {
        const isTargetUser = checkIDInString(fColumn, userId);
        if (!isTargetUser) return;
      }

      const card = document.createElement('div');
      card.className = 'survey-card';

      let actionBtnHTML = '';
      if (currentState === 'earned') {
        actionBtnHTML = `<button class="btn done" disabled>回答済み</button>`;
      } else if (currentState === 'pending') {
        actionBtnHTML = `<button class="btn pending-btn" disabled>判定中</button>`;
      } else {
        actionBtnHTML = `<button class="btn" onclick="openConfirmModal('${encodeURIComponent(name)}', '${encodeURIComponent(link)}', ${point})">回答する</button>`;
      }

      card.innerHTML = `
        <div class="survey-info">
          <div class="survey-name">${name}</div>
          <div class="survey-point">+${point} pt</div>
        </div>
        <div class="survey-action">
          ${actionBtnHTML}
        </div>
      `;

      if (type === '事前') {
        preContainer.appendChild(card);
        preCount++;
      } else if (type === '本') {
        mainContainer.appendChild(card);
        mainCount++;
      }
    });

    if (preCount === 0) preContainer.innerHTML = `<div style="font-size:0.85rem; color:var(--text-sub); text-align:center; padding:12px;">現在回答できる事前アンケートはありません</div>`;
    if (mainCount === 0) mainContainer.innerHTML = `<div style="font-size:0.85rem; color:var(--text-sub); text-align:center; padding:12px;">現在回答できる本アンケートはありません</div>`;

    localStorage.setItem('crawl_answered_state', JSON.stringify(answeredState));

    currentEarnedPoint = totalEarned;
    document.getElementById('earnedPoint').textContent = `${totalEarned} pt`;
    document.getElementById('pendingPoint').textContent = `${totalPending} pt`;
  }

  function openConfirmModal(encName, encLink, point) {
    if (!userData) {
      alert('先に初回登録アンケートを行ってください。');
      return;
    }

    const name = decodeURIComponent(encName);
    const link = decodeURIComponent(encLink);

    document.getElementById('modalTitle').textContent = "アンケート回答確認";
    document.getElementById('modalMsg').innerHTML = `個人番号（<strong>${userId}</strong>）を確認してからアンケートを行ってください。<br><br>回答完了後、ポイントは「判定中Point」へ反映されます。`;
    
    document.getElementById('modalBtnGroup').innerHTML = `
      <button class="modal-btn cancel" onclick="closeModal()">キャンセル</button>
      <button class="modal-btn go" onclick="startSurvey('${encodeURIComponent(name)}', '${encodeURIComponent(link)}')">アンケートへ進む</button>
    `;

    document.getElementById('confirmModal').style.display = 'flex';
  }

  function startSurvey(encName, encLink) {
    const name = decodeURIComponent(encName);
    const link = decodeURIComponent(encLink);

    answeredState[name] = 'pending';
    localStorage.setItem('crawl_answered_state', JSON.stringify(answeredState));

    closeModal();
    window.open(link, '_blank');

    alert('回答ありがとうございます！\n判定中Point に反映されました！');
    fetchSpreadsheetData();
  }

  function closeModal() {
    document.getElementById('confirmModal').style.display = 'none';
  }

  /* EXCHANGE POINT FUNCTIONS */
  function openExchangeModal() {
    if (!userData) {
      alert('先に初回登録アンケートを行ってください。');
      return;
    }
    document.getElementById('exchangeModal').style.display = 'flex';
  }

  function closeExchangeModal() {
    document.getElementById('exchangeModal').style.display = 'none';
  }

  function execExchangeEmail() {
    const ptsInput = document.getElementById('exchangePtsInput').value.trim();
    const pts = parseInt(ptsInput);

    if (!ptsInput || isNaN(pts) || pts < 10) {
      alert('交換ポイント数は10 pt以上を入力してください。');
      return;
    }

    if (pts > currentEarnedPoint) {
      alert(`交換申請できるのは「獲得Point」の範囲内のみです。\n現在の獲得Point: ${currentEarnedPoint} pt`);
      return;
    }

    const recipient = "sixyami67@gmail.com";
    const subject = encodeURIComponent("ポイント交換申請（現金等）");
